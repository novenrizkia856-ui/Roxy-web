<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Roxy schedules recurring purchases of Robinhood Chain Stock Tokens. Non-custodial: your funds never rest in the contract. The underlying contract is named Recur."
    />
    <meta name="theme-color" content="#0e0d0b" />

    <!-- The 16px icon is drawn from the mark's two central bands. All four collapse into each
         other at that size, and a muddy tab icon is worse than a simplified one. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Without these a shared link renders as a bare box. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roxy" />
    <meta property="og:url" content="https://www.useroxy.app/" />
    <meta property="og:title" content="Roxy, noncustodial scheduler" />
    <meta
      property="og:description"
      content="Buy the same amount, on the same day, without being there. Your money never sits in the contract."
    />
    <meta property="og:image" content="https://www.useroxy.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Roxy mark and wordmark, over a banner reading noncustodial scheduler." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roxy, noncustodial scheduler" />
    <meta
      name="twitter:description"
      content="Buy the same amount, on the same day, without being there. Your money never sits in the contract."
    />
    <meta name="twitter:image" content="https://www.useroxy.app/og.jpg" />

    <!-- Two typefaces, per the design direction: a text serif for prose and headings, and a
         monospace reserved exclusively for figures, labels and controls. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Roxy, scheduled purchases for Stock Tokens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
